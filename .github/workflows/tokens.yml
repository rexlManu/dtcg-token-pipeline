name: Tokens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: Build and check tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and check every brand
        run: pnpm check:all
      - name: Test contrast maths and shipped brands
        run: pnpm test
      - name: Upload contrast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-reports
          path: dist/*/contrast-report.json
          retention-days: 14
